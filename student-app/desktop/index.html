<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FPT Polytechnic AI Tutor</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
    }
    #root {
      width: 100%;
      height: 100vh;
    }
    /* Loading spinner */
    .loading-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      gap: 16px;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #1890ff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading-container">
      <div class="spinner"></div>
      <div>Đang tải ứng dụng...</div>
    </div>
  </div>

  <!-- Polyfill require and global for externalized node: modules -->
  <script>
    // Polyfill global object for browser-like environment
    if (typeof global === 'undefined') {
      window.global = window;
    }

    // This script runs before the bundle loads
    // It provides require() for webpack externalized node: modules
    (function() {
      // Wait for preload script to expose __node_require__
      function setupRequire() {
        if (typeof window.__node_require__ === 'function') {
          // Create a global require that webpack externalized modules can use
          // This will be called by webpack's external module loader
          window.require = function(moduleName) {
            if (moduleName && moduleName.startsWith('node:')) {
              return window.__node_require__(moduleName);
            }
            // For non-node: modules, try to get from __node_require__
            try {
              return window.__node_require__(`node:${moduleName}`);
            } catch (e) {
              throw new Error(`Cannot require ${moduleName} in renderer`);
            }
          };
          console.log('✅ require() polyfill initialized');
        } else {
          // Retry after a short delay
          setTimeout(setupRequire, 10);
        }
      }
      setupRequire();
    })();
  </script>

  <!-- Load the bundled renderer -->
  <script src="./renderer/dist/renderer.bundle.js"></script>
</body>
</html>
